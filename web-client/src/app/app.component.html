@if (isLoggedIn) {
  <main class="min-h-screen bg-[#0b0a09] text-white flex flex-col p-4 md:p-6">
    <div class="max-w-[1400px] w-full mx-auto flex flex-col flex-1">
      <nav class="flex flex-wrap justify-between items-center gap-3 w-full mb-8 bg-[rgba(255,255,255,0.06)] backdrop-blur-md border border-white/10 rounded-2xl px-4 py-3 shadow-lg">
        <div class="flex items-center gap-6">
          <span class="font-display text-lg font-semibold tracking-tight text-white/95 flex items-center gap-2 pr-2 border-r border-white/10">
            <span class="inline-block w-2 h-2 rounded-full bg-brand-400"></span>
            TrustAI<span class="text-brand-400">Chain</span>
          </span>
          <div class="flex flex-wrap gap-1">
            <a routerLink="/chat" routerLinkActive="bg-brand-500/15 text-brand-300 border-brand-500/30" class="px-4 py-2 rounded-xl font-medium text-sm text-white/65 border border-transparent hover:text-white hover:bg-white/[0.06] transition-colors">Chatbot</a>
            @if (isAdmin) {
              <a routerLink="/dashboard" routerLinkActive="bg-brand-500/15 text-brand-300 border-brand-500/30" class="px-4 py-2 rounded-xl font-medium text-sm text-white/65 border border-transparent hover:text-white hover:bg-white/[0.06] transition-colors">Dashboard</a>
              <a routerLink="/audit" routerLinkActive="bg-brand-500/15 text-brand-300 border-brand-500/30" class="px-4 py-2 rounded-xl font-medium text-sm text-white/65 border border-transparent hover:text-white hover:bg-white/[0.06] transition-colors">Auditeur</a>
              <a routerLink="/audit-history" routerLinkActive="bg-brand-500/15 text-brand-300 border-brand-500/30" class="px-4 py-2 rounded-xl font-medium text-sm text-white/65 border border-transparent hover:text-white hover:bg-white/[0.06] transition-colors">Historique</a>
            }
            @if (isAdmin || isViewer) {
              <a routerLink="/timeline" routerLinkActive="bg-brand-500/15 text-brand-300 border-brand-500/30" class="px-4 py-2 rounded-xl font-medium text-sm text-white/65 border border-transparent hover:text-white hover:bg-white/[0.06] transition-colors">Timeline</a>
            }
          </div>
        </div>

        <button (click)="logout()" class="px-3 py-2 text-sm text-white/50 font-medium hover:text-red-400 hover:bg-red-500/10 rounded-xl transition-colors flex items-center gap-2">
          Déconnexion
        </button>
      </nav>

      <div class="w-full flex-1 bg-transparent">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
}
