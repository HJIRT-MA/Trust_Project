@if (isLoggedIn) {
  <main class="min-h-screen bg-[#0f0b1e] text-white flex flex-col p-6">
    <nav class="flex justify-between items-center w-full mb-8 bg-[rgba(255,255,255,0.07)] backdrop-blur-md border border-white/10 rounded-2xl p-3 shadow-lg">
      <div class="flex gap-4">
        <a routerLink="/chat" routerLinkActive="bg-indigo-500/20 text-indigo-300" class="px-4 py-2 rounded-xl font-medium text-white/70 hover:text-white hover:bg-white/10 transition-colors">Chatbot</a>
        @if (isAdmin) {
          <a routerLink="/dashboard" routerLinkActive="bg-indigo-500/20 text-indigo-300" class="px-4 py-2 rounded-xl font-medium text-white/70 hover:text-white hover:bg-white/10 transition-colors">Dashboard (Admin)</a>
        }
      </div>
      
      <button (click)="logout()" class="px-4 py-2 text-red-400 font-medium hover:bg-red-500/10 rounded-xl transition-colors flex items-center gap-2">
        Déconnexion
      </button>
    </nav>

    <div class="w-full flex-1 bg-transparent">
      <router-outlet></router-outlet>
    </div>
  </main>
}
