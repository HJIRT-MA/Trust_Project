server:
  port: 8080

spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/trustai-realm
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:4200}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Toutes les API REST/SSE exposées par rag-service (RagController, GuardController,
        # AuditController, BlockchainProofController) passent par le point d'entrée unique.
        - id: rag-service-api
          uri: http://localhost:8082
          predicates:
            - Path=/api/**
          filters:
            - TokenRelay=
        # Canal WebSocket/STOMP (chat en streaming). Route séparée car le schéma d'URI
        # change (ws:// au lieu de http://) ; l'upgrade doit rester public au niveau HTTP
        # (voir gateway SecurityConfig), l'authentification réelle se fait via le frame
        # STOMP CONNECT envoyé par le client une fois la socket établie.
        - id: rag-service-ws
          uri: ws://localhost:8082
          predicates:
            - Path=/ws/**

management:
  endpoints:
    web:
      exposure:
        include: health, info