server:
  port: 8082

spring:
  application:
    name: rag-service
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  datasource:
    url: jdbc:postgresql://localhost:5432/trustaidb
    username: trustai_user
    password: trustai_password
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/trustai-realm

groq:
  api:
    key: "sk-dummy-key"
  model: "llama3-8b-8192"

keycloak:
  server-url: http://localhost:8081
  target-realm: trustai-realm
  admin:
    username: admin
    password: admin
    client-id: admin-cli
