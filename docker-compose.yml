version: '3.8'

services:
  # 1. PostgreSQL (with pgvector pre-installed for Week 3)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trustai-postgres
    environment:
      POSTGRES_USER: trustai_user
      POSTGRES_PASSWORD: trustai_password
      POSTGRES_DB: trustaidb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. Apache Kafka (KRaft mode - No Zookeeper required)
  kafka:
    image: apache/kafka:latest
    container_name: trustai-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  # 3. Keycloak (Connected to Postgres)
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: trustai-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Database connection settings
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/trustaidb
      KC_DB_USERNAME: trustai_user
      KC_DB_PASSWORD: trustai_password
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

# Named volumes to persist your database and message broker data
volumes:
  postgres_data:
  kafka_data: